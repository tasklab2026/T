<style>
:root{
  --bg:#030716;--bg2:#07142f;--card:#0b1a3d;--border:#6ba6ff33;
  --text:#f8fbff;--muted:#a7b4d6;--blue:#12b6ff;--blue2:#216bff;
  --purple:#8d42ff;--cyan:#34f5ff;--green:#1ee6a3;--red:#ff4d6d;--yellow:#fbbf24
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
  radial-gradient(circle at 10% 5%,#8d42ff45,transparent 30%),
  radial-gradient(circle at 90% 20%,#12b6ff35,transparent 30%),
  linear-gradient(180deg,var(--bg),var(--bg2),#030713);
  color:var(--text);
  font-family:"Hind Siliguri",Inter,sans-serif
}
button,input,select{font-family:inherit}
.hidden{display:none!important}

.app{
  max-width:460px;margin:auto;min-height:100vh;padding:14px 14px 90px
}
.nav{
  position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;
  align-items:center;padding:10px;border:1px solid var(--border);
  border-radius:23px;background:#061027dd;backdrop-filter:blur(18px);margin-bottom:14px
}
.brand{
  display:flex;gap:10px;align-items:center;font-size:23px;font-weight:800
}
.logo{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue2),var(--purple));
  box-shadow:0 0 25px #216bff55;font-weight:800;overflow:hidden;flex-shrink:0
}
.logo img{width:100%;height:100%;object-fit:cover}

.icon{
  width:40px;height:40px;border:1px solid var(--border);border-radius:14px;
  background:#fff1;color:#fff;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center
}

.card{
  background:linear-gradient(145deg,#0c1b3fd0,#081129d0);
  border:1px solid var(--border);border-radius:25px;padding:16px;margin-bottom:14px;
  box-shadow:0 18px 50px #0005,inset 0 1px #fff1;backdrop-filter:blur(18px)
}
.hero{
  padding:24px 19px;text-align:center;border-radius:31px;
  background:
  radial-gradient(circle at 15% 18%,#c155ff70,transparent 32%),
  radial-gradient(circle at 78% 55%,#12b6ff66,transparent 36%),
  linear-gradient(130deg,#4526b1e0,#1437a6d1,#110c34e0);
  border:1px solid #8f50ff99
}
.hero h1{font-size:35px;line-height:1.12;margin:10px 0}
.grad{
  background:linear-gradient(135deg,var(--cyan),#fff,#c155ff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.muted{color:var(--muted)}
.small{font-size:12px}
.row,.grid{display:grid;gap:10px}
.row,.grid{grid-template-columns:1fr 1fr}

.btn{
  min-height:48px;border:0;border-radius:17px;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--blue2),var(--purple),var(--cyan));
  box-shadow:0 12px 30px #216bff35;padding:0 12px;cursor:pointer
}
.btn.alt{
  background:#fff0;border:1px solid var(--border);box-shadow:none
}
.btn:disabled{opacity:.55;cursor:not-allowed}

.stat{
  padding:14px;border:1px solid var(--border);border-radius:19px;background:#fff1
}
.stat b{display:block;font-size:20px}

.section{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:11px
}
.section h3,.section h2{margin:0}
.pill{
  padding:4px 9px;border-radius:99px;background:#1ee6a31a;color:var(--green);font-size:11px
}
.item{
  display:flex;justify-content:space-between;align-items:center;padding:12px;
  border-radius:17px;background:#fff1;border:1px solid #fff1;margin-bottom:9px
}
.item strong{display:block}

.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(460px,100%);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px;background:#061027ee;border-top:1px solid var(--border);
  backdrop-filter:blur(18px)
}
.bottom button{
  border:0;background:none;color:var(--muted);font-size:10px;cursor:pointer
}
.bottom button.active{color:#fff}
.bottom span{display:block;font-size:18px}

.auth{min-height:100vh;display:grid;place-items:center}
.authbox{width:100%;max-width:420px}

input,select{
  width:100%;height:48px;border-radius:15px;border:1px solid var(--border);
  background:#020817;color:#fff;padding:0 13px;outline:none;margin-bottom:10px
}
label{
  display:block;color:var(--muted);font-size:12px;margin:4px 0
}

.toast,.success-toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:100000;color:#fff;padding:10px 15px;border-radius:13px;font-size:13px;
  max-width:90%;text-align:center
}
.toast{background:#102653;border:1px solid var(--border)}
.success-toast{
  background:#16a34a;border:1px solid #4ade80;padding:13px 18px;
  font-size:15px;font-weight:700;box-shadow:0 8px 25px #0005
}

.verify-banner{
  background:linear-gradient(135deg,var(--blue2),var(--purple));
  border:1px solid var(--border);border-radius:18px;padding:12px 16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center
}

.method-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px
}
.method-card{
  background:#0b1a3d;border:2px solid var(--border);border-radius:16px;
  padding:15px 8px;text-align:center;cursor:pointer;color:#fff;font-weight:600;
  transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px
}
.method-card img{
  width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px
}
.method-card.active{
  border-color:var(--blue);background:#12b6ff15
}

.deposit-box{
  background:linear-gradient(145deg,#0c1b3fd8,#07122bd8);
  border:1px solid var(--border);border-radius:22px;padding:16px;color:#fff;
  margin-bottom:14px;box-shadow:0 10px 30px #0004
}
.deposit-box ol{padding-left:18px;margin:10px 0}
.deposit-box li{margin-bottom:8px;font-size:13.5px;line-height:1.4}

.task-card{
  position:relative;overflow:hidden;background:linear-gradient(145deg,#101f49e8,#07132ee8);
  border:1px solid #6ba6ff44;border-radius:22px;padding:14px;margin-bottom:12px;
  box-shadow:0 10px 30px #0005
}
.task-top{display:flex;align-items:center;gap:12px}
.task-logo{
  width:58px;height:58px;border-radius:15px;display:grid;place-items:center;
  background:#fff;overflow:hidden;flex-shrink:0;border:1px solid #ffffff22
}
.task-logo img{
  width:48px;height:48px;object-fit:contain;display:block
}
.task-logo .fallback{font-size:25px;line-height:1}
.task-info{flex:1;min-width:0}
.task-title{
  font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.task-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.reward-badge{
  display:inline-block;margin-top:6px;padding:4px 9px;border-radius:99px;
  background:#1ee6a31a;color:var(--green);font-size:11px;font-weight:700
}
.task-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px
}
.task-btn{
  min-height:43px;border:0;border-radius:14px;font-weight:800;cursor:pointer;color:#fff
}
.open-btn{background:linear-gradient(135deg,#216bff,#12b6ff)}
.claim-btn{background:linear-gradient(135deg,#8d42ff,#c155ff)}
.claim-btn.locked{
  background:#ffffff12;border:1px solid #ffffff22;color:#8492b5
}
.task-btn:disabled{opacity:.6;cursor:not-allowed}
.task-note{
  margin-top:9px;padding:8px 10px;border-radius:12px;background:#ffb30010;
  border:1px solid #ffb30025;font-size:11px;color:#d9c99a
}
.task-banner{
  width:100%;max-height:180px;object-fit:cover;border-radius:14px;
  margin-top:10px;border:1px solid var(--border);display:block
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999999;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px)
}
.modal-box{
  background:#fff;color:#333;width:100%;max-width:380px;border-radius:18px;
  padding:36px 24px 30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45);
  font-family:Inter,sans-serif
}
.modal-icon-wrap{
  width:90px;height:90px;border:5px solid #f87171;border-radius:50%;
  margin:0 auto 24px;display:flex;align-items:center;justify-content:center;background:#fff
}
.modal-icon-wrap svg{
  width:46px;height:46px;stroke:#ef4444;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;fill:none
}
.modal-title{font-size:27px;font-weight:700;color:#374151;margin-bottom:14px}
.modal-desc{font-size:16px;color:#4b5563;line-height:1.5;margin-bottom:28px}
.modal-btn{
  background:#7c65e8;color:#fff;border:0;padding:12px 45px;border-radius:8px;
  font-size:16px;font-weight:600;cursor:pointer
}

.history-card{
  background:linear-gradient(145deg,#0c1b3fd8,#07122bd8);
  border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px
}
.history-top{
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.history-amount{font-size:20px;font-weight:800}
.status{
  display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800
}
.status.pending{
  background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b40
}
.status.success{
  background:#22c55e20;color:#4ade80;border:1px solid #22c55e40
}
.status.rejected{
  background:#ef444420;color:#f87171;border:1px solid #ef444440
}
.status.unknown{
  background:#ffffff10;color:#a7b4d6;border:1px solid #ffffff20
}
.history-info{
  margin-top:10px;padding-top:10px;border-top:1px solid #ffffff10;
  font-size:12px;color:var(--muted);line-height:1.7
}
.empty-history{text-align:center;padding:30px 15px;color:var(--muted)}

/* 🎧 হেল্প সেন্টার */
.support-widget{
  position:fixed;bottom:75px;right:18px;z-index:999;display:flex;
  align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue2),var(--purple));
  color:#fff;padding:10px 16px;border-radius:50px;
  box-shadow:0 8px 25px rgba(33,107,255,.4);cursor:pointer;text-decoration:none;
  font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.2);
  animation:pulseSupport 2s infinite,floatSupport 3s ease-in-out infinite;
  backdrop-filter:blur(10px)
}
.support-widget svg{
  width:22px;height:22px;fill:currentColor;
  animation:rotateIcon 4s ease-in-out infinite
}
@keyframes pulseSupport{
  0%{box-shadow:0 0 0 0 rgba(141,66,255,.6)}
  70%{box-shadow:0 0 0 12px rgba(141,66,255,0)}
  100%{box-shadow:0 0 0 0 rgba(141,66,255,0)}
}
@keyframes floatSupport{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes rotateIcon{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-10deg)}
  75%{transform:rotate(10deg)}
}

/* 🔴 নোটিফিকেশন লাল ডট */
.notif-dot{
  position:absolute;
  top:5px;
  right:5px;
  width:11px;
  height:11px;
  background:var(--red);
  border-radius:50%;
  border:2px solid var(--bg2);
  box-shadow:0 0 10px var(--red);
  z-index:10;
  animation:notifPulse 1.5s infinite
}
@keyframes notifPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.25);opacity:.75}
}

/* ================= NEXORA PREMIUM REDESIGN ================= */
:root{
  --bg:#07110e;--bg2:#0b1712;--card:#101f18;--border:#b4f5c522;

  --purple:#b2f56e;--cyan:#c8ff8a;--green:#65e6a0;--red:#ff6b75;--yellow:#f6c96b;
  --nx-line:rgba(184,245,204,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);
  background:
    radial-gradient(ellipse at 8% 0%,rgba(28,151,91,.18),transparent 34%),

}

}

  display:flex;align-items:center;justify-content:center;font-size:18px
}
.card{

}

    radial-gradient(circle at 90% 10%,#b5f36b25,transparent 30%),
    radial-gradient(circle at 12% 100%,#1ab8792c,transparent 38%),

.grad{

}
.muted{color:var(--muted)}
.small{font-size:12px;letter-spacing:.01em}
.row,.grid{display:grid;gap:12px}
.row,.grid{grid-template-columns:1fr 1fr}

}

}

.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.section h3,.section h2{margin:0;font-size:18px}

  padding:5px 11px;border-radius:99px;background:#65e6a018;color:#8af0b2;
  border:1px solid #65e6a02b;font-size:11px;font-weight:800;letter-spacing:.04em
}
.item{

}
.item strong{display:block}

.bottom button{
  border:0;background:none;color:#8da596;font-size:11px;cursor:pointer;
  padding:6px 2px;border-radius:14px;font-weight:600
}
.bottom button.active{color:#bdf58e;background:#b5f36b12}

/* Premium app-install card in Profile, below Transactions */
.app-install-card{
  display:flex;align-items:center;gap:13px;width:100%;min-width:0;
  margin:0 0 12px;padding:12px;border-radius:19px;text-decoration:none;
  color:#f3fff6;background:linear-gradient(110deg,#09251a,#103b28 58%,#174b2d);
  border:1px solid rgba(169,243,181,.24);
  box-shadow:0 10px 28px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.07);
  transition:transform .2s ease,filter .2s ease,border-color .2s ease;
}
.app-install-card:hover{transform:translateY(-2px);filter:brightness(1.08);border-color:#a8ef9a88}
.app-install-icon{
  width:66px;height:66px;min-width:66px;overflow:hidden;border-radius:17px;
  display:grid;place-items:center;background:#07130c;border:1px solid #b7f58b66;
  box-shadow:0 0 18px #5cda7540;
}
.app-install-icon img{width:100%;height:100%;object-fit:cover;display:block}
.app-install-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.app-install-copy strong{font-family:Inter,"Hind Siliguri",sans-serif;font-size:19px;font-weight:800;line-height:1.15}
.app-install-copy small{font-size:12px;color:#c4e8ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-install-action{
  flex-shrink:0;display:grid;place-items:center;min-width:94px;min-height:48px;
  padding:0 13px;border-radius:15px;background:linear-gradient(135deg,#b9f77d,#61df9b);
  color:#07351f;font-family:Inter,sans-serif;font-size:16px;font-weight:900;
  box-shadow:0 5px 16px #54d78a35;
}
@media(max-width:390px){
  .app-install-card{gap:9px;padding:10px}
  .app-install-icon{width:56px;height:56px;min-width:56px;border-radius:15px}
  .app-install-copy strong{font-size:17px}
  .app-install-copy small{font-size:10px}
  .app-install-action{min-width:78px;min-height:44px;font-size:14px;padding:0 9px}
}
.bottom span{display:block;font-size:19px;margin-bottom:3px}
.auth{min-height:100vh;display:grid;place-items:center}
.authbox{width:100%;max-width:470px}
.authbox .card{
  padding:34px 28px;border-radius:28px;text-align:center!important;
  background:linear-gradient(150deg,#14271b,#0b1911);
  border:1px solid #b4f5c52b;box-shadow:0 25px 90px #0008

<script type="module">

import {initializeApp}

}

/* ================= FIREBASE ================= */

const firebaseConfig={
  apiKey:"AIzaSyB_Tu5HCBRqCXHytJuFcXf3LPkL0SklHYA",
  authDomain:"taka-d3b9f.firebaseapp.com",
  databaseURL:"https://taka-d3b9f-default-rtdb.firebaseio.com",
  projectId:"taka-d3b9f",
  storageBucket:"taka-d3b9f.firebasestorage.app",
  messagingSenderId:"851877882211",
  appId:"1:851877882211:web:9604f7596e3d7cfcaf8b56",
  measurementId:"G-WE0PZ2CVJF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);


/* ================= DATA ================= */

let u=null;

let d={
  balance:0,
  totalEarned:0,
  referrals:0,
  name:"",
  refCode:"",
  isVerified:false
};

let current="home";

let adminSettings={
  bkash:"01326669575",
  nagad:"01326669575",
  rocket:"",
  withdrawMin:50,
  withdrawMax:0,
  minWithdraw:50,
  maxWithdraw:0,
  verificationFee:20,
  siteLogo:"",
  telegramHelp:"",
  appInstallUrl:""
};


/* ================= HELPERS ================= */

const $=x=>document.getElementById(x);

const money=x=>"৳"+Number(x||0).toFixed(2);

function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function safeUrl(s){
  try{
    const u=new URL(String(s||"").trim());
    return ["http:","https:"].includes(u.protocol)?u.href:"";
  }catch{
    return "";
  }
}


/* ================= TASK HELPERS ================= */

function getTaskUrl(t){
  return safeUrl(
    t?.url ||
    t?.link ||
    t?.taskUrl ||
    t?.taskURL ||
    t?.videoUrl ||
    t?.videoURL ||
    t?.youtubeUrl ||
    t?.youtubeURL ||
    ""
  );
}

function getTaskLogo(t){

  const custom=safeUrl(
    t?.logo ||
    t?.logoUrl ||
    t?.icon ||
    t?.iconUrl ||
    t?.taskLogo ||
    t?.taskLogoUrl ||
    t?.image ||
    ""
  );

  if(custom)return custom;

  const type=String(t?.platform||t?.type||"").toLowerCase();
  const link=getTaskUrl(t).toLowerCase();

  if(type.includes("youtube")||link.includes("youtube")||link.includes("youtu.be"))
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg";

  if(type.includes("facebook")||link.includes("facebook"))
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg";

  if(type.includes("tiktok")||link.includes("tiktok"))
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg";

  if(type.includes("telegram")||link.includes("t.me")||link.includes("telegram"))
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg";

  return "";
}

function taskLogo(t){

  const src=getTaskLogo(t);

  return src
    ? `<img src="${esc(src)}"
        alt="Task logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
       <span class="fallback" style="display:none">▶️</span>`
    : `<span class="fallback">▶️</span>`;
}


/* ================= TOAST ================= */

function toast(x){

  const t=$("toast");
  if(!t)return;

  t.textContent=x;
  t.classList.remove("hidden","success-toast");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(
    ()=>t.classList.add("hidden"),
    3500
  );
}

function successMessage(x){

  const t=$("toast");
  if(!t)return;

  t.textContent=x;
  t.classList.remove("hidden");
  t.classList.add("success-toast");

  clearTimeout(window.__successTimer);

  window.__successTimer=setTimeout(()=>{
    t.classList.add("hidden");
    t.classList.remove("success-toast");
  },5000);
}


/* ================= MODAL ================= */

window.showModal=(title,desc)=>{
  $("modalTitle").textContent=title;
  $("modalDesc").textContent=desc;
  $("customModal").classList.remove("hidden");
};

window.closeModal=()=>{
  $("customModal").classList.add("hidden");
};


/* ================= AUTH ================= */

function msg(e){

  const c=e?.code||"";

  if(c==="auth/email-already-in-use")
    return "❌ এই ইমেইল দিয়ে ইতিপূর্বে অ্যাকাউন্ট খোলা হয়েছে।";

  if(c==="auth/weak-password")
    return "❌ পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।";

  if(c==="auth/invalid-email")
    return "❌ সঠিক ইমেইল দিন।";

  if(c==="auth/invalid-credential")
    return "❌ ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";

  if(c==="auth/network-request-failed")
    return "❌ ইন্টারনেট কানেকশন চেক করুন।";

  return "❌ "+(e?.message||"সমস্যা হয়েছে");
}

window.toggleAuth=()=>{
  $("login").classList.toggle("hidden");
  $("register").classList.toggle("hidden");
};

window.loginUser=async()=>{

  try{

    let email=$("le").value.trim();
    let pass=$("lp").value;

    if(!email)return toast("ইমেইল দিন");
    if(!pass)return toast("পাসওয়ার্ড দিন");

    await signInWithEmailAndPassword(auth,email,pass);

  }catch(e){

    console.error(e);
    toast(msg(e));

  }
};

window.registerUser=async()=>{

  try{

    let name=$("rn").value.trim();
    let email=$("re").value.trim();
    let pass=$("rp").value;
    let refc=$("rr").value.trim().toUpperCase();

    if(!name)throw Error("দয়া করে আপনার নাম লিখুন");
    if(!email)throw Error("দয়া করে ইমেইল লিখুন");

    if(!pass||pass.length<6)
      throw Error("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে");

    let c=await createUserWithEmailAndPassword(
      auth,
      email,
      pass
    );

    let generatedRef=c.user.uid.slice(0,8).toUpperCase();

    await updateProfile(c.user,{
      displayName:name
    });

    await set(
      ref(db,"users/"+c.user.uid),
      {
        name,
        email,
        balance:0,
        totalEarned:0,
        referrals:0,
        refCode:generatedRef,
        referredBy:refc,
        isVerified:false,
        createdAt:serverTimestamp()
      }
    );

    successMessage("✅ অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!");

  }catch(e){

    console.error(e);
    toast(msg(e));

  }
};

window.logoutUser=async()=>{

  try{
    await signOut(auth);
  }catch(e){
    toast(msg(e));
  }

};


/* ================= VERIFY BANNER ================= */

function verifyBannerHtml(){

  if(d.isVerified)

    return `
      <div class="pill"
        style="margin-bottom:14px;text-align:center;display:block;padding:9px">

      </div>
    `;

  return `
    <div class="verify-banner">
      <div>
        <b>🔐 অ্যাকাউন্ট ভেরিফিকেশন</b>

      <button

        onclick="page('verification')">
        ভেরিফাই
      </button>
    </div>
  `;
}


/* ================= TASK STATUS ================= */

function getTaskStatus(taskId){

  for(const key in taskRequests){

    const r=taskRequests[key];

    if(
      r &&
      (
        r.taskId===taskId ||
        key.startsWith(taskId+"_")
      )
    )
      return r;
  }

  return null;
}


/* ================= HOME ================= */

function home(){

  return `
    ${verifyBannerHtml()}

    <section class="hero">

      <div class="small">

/* ================= OPEN TASK ================= */

window.openTask=(id,encoded)=>{

  try{

    if(!u)
      return toast("আগে login করুন");

    let link="";

    try{
      link=decodeURIComponent(encoded||"").trim();
    }catch{
      link=String(encoded||"").trim();
    }

    link=safeUrl(link);

    if(!link)

      return showModal(
        "লিংক নেই",
        "Admin Panel-এর Task URL ঘরে সম্পূর্ণ https:// ভিডিও লিংক দিন।"
      );

    const today=new Date().toISOString().slice(0,10);
    const key=id+"_"+today;
    const opened="taskOpened_"+id+"_"+today;
    const old=getTaskStatus(id);

    if(["approved","success"].includes(old?.status))
      return toast("✅ এই Task-এর Reward ইতিমধ্যে দেওয়া হয়েছে");

    const w=window.open(
      link,
      "_blank",
      "noopener,noreferrer"
    );

    if(!w)
      window.location.href=link;

    sessionStorage.setItem(opened,"1");

    update(
      ref(db,`taskRequests/${u.uid}/${key}`),
      {
        uid:u.uid,
        taskId:id,
        date:today,
        opened:true,
        openedAt:serverTimestamp(),
        status:old?.status||"opened"
      }
    ).catch(console.warn);

    toast(
      "✅ কাজের লিংক Open হয়েছে। কাজ শেষ করে ফিরে এসে Claim চাপুন।"
    );

  }catch(e){

    console.error(e);
    toast("❌ Task Open করতে সমস্যা হয়েছে");

  }

};


/* ================= CLAIM ================= */

window.claimTask=async(id,rewardAmt)=>{

  try{

    if(!u)
      return toast("আগে লগইন করুন");

    const today=new Date().toISOString().slice(0,10);
    const key=id+"_"+today;
    const opened="taskOpened_"+id+"_"+today;

    const ts=await get(ref(db,`adminTasks/${id}`));

    if(!ts.exists())
      return toast("❌ Task আর পাওয়া যাচ্ছে না");

    const t=ts.val()||{};

    if(t.active===false)
      return toast("❌ এই Task বর্তমানে বন্ধ আছে");

    const reward=Number(
      t.reward!==undefined
      ? t.reward
      : rewardAmt
    );

    const old=getTaskStatus(id);

    if(!Number.isFinite(reward)||reward<=0)
      return toast("❌ Task Reward সঠিক নয়");

    if(["approved","success"].includes(old?.status))
      return toast("✅ Reward ইতিমধ্যে দেওয়া হয়েছে");

    if(old?.status==="pending")
      return toast("⏳ Claim Request Pending আছে");

    if(
      sessionStorage.getItem(opened)!=="1" &&
      old?.opened!==true
    )
      return showModal(
        "আগে Task Open করুন",
        "Claim করার আগে Task-এর লিঙ্কে প্রবেশ করুন এবং কাজটি সম্পন্ন করুন।"
      );

    const r=push(ref(db,"taskClaimRequests"));
    const claimId=r.key;

    const updates={};

    updates[`taskRequests/${u.uid}/${key}`]={
      uid:u.uid,
      taskId:id,
      taskTitle:t.title||"Task",
      reward,
      date:today,
      opened:true,
      status:"pending",
      claimId,
      createdAt:serverTimestamp()
    };

    updates[`taskClaimRequests/${claimId}`]={
      uid:u.uid,
      taskId:id,
      taskTitle:t.title||"Task",
      reward,
      name:d.name||u.displayName||"User",
      email:u.email||"",
      status:"pending",
      requestKey:key,
      createdAt:serverTimestamp()
    };

    await update(ref(db),updates);

    sessionStorage.removeItem(opened);

    successMessage(
      "✅ Claim Request সফলভাবে পাঠানো হয়েছে। Admin যাচাই করবেন।"
    );

    render();

  }catch(e){

    console.error(e);
    toast("❌ Claim Request পাঠাতে সমস্যা হয়েছে");

  }

};

window.withdrawReq=async()=>{

      );

    let amount=Number($("wa")?.value||0);

      0
    );

      return showModal(

    await set(
      rr,
      {
        uid:u.uid,
        name:d.name||u.displayName||"",
        email:u.email||"",
        amount,
        method,
        number:num,
        status:"pending",
        createdAt:serverTimestamp()
      }
    );

    await update(
      ref(db,"users/"+u.uid),
      {
        balance:balance-amount
      }
    );

    successMessage(
      "✅ Withdrawal Request সফলভাবে পাঠানো হয়েছে। সচিব বা এডমিন যাচাই করবেন।"

    );

  }

};

function getWithdrawStatus(s){

  s=String(s||"pending").toLowerCase();

  if(
    ["success","successful","approved","paid","completed"]
    .includes(s)
  )
    return{
      className:"success",
      text:"✅ Success"
    };

  if(
    ["rejected","reject","cancelled","canceled"]
    .includes(s)
  )
    return{
      className:"rejected",
      text:"❌ Rejected"
    };

  return{
    className:"pending",
    text:"⏳ Pending"
  };
}

function formatDate(ts){

  if(!ts)
    return "সময় পাওয়া যায়নি";

  let date=
    typeof ts==="object"&&ts?.seconds
    ?new Date(Number(ts.seconds)*1000)
    :new Date(ts);

  return isNaN(date.getTime())
    ?"সময় পাওয়া যায়নি"
    :date.toLocaleString(
      "bn-BD",
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );
}

  if(!withdrawHistory.length)

    h+=`

      <div class="empty-history">
        📬<br>
        <b>এখনও কোনো Withdrawal নেই</b>

        <p class="small">
          Withdraw Request দিলে এখানে দেখা যাবে।
        </p>
      </div>

    `;

  else

    withdrawHistory.forEach(i=>{

      let s=getWithdrawStatus(i.status);

      h+=`

        <div class="history-card">

          <div class="history-top">

            <div>

              <div class="small muted">
                Withdrawal
              </div>

              <div class="history-amount">
                ${money(i.amount)}
              </div>

            </div>

            <div class="status ${s.className}">
              ${s.text}
            </div>

          </div>

          <div class="history-info">

            💳 মাধ্যম:
            <strong style="color:#fff">
              ${esc(i.method||"")}
            </strong>

            <br>

            📱 নম্বর:
            <strong style="color:#fff">
              ${esc(i.number||"")}
            </strong>

            <br>

            🆔 Request ID:
            ${esc(i.id||"")}

            <br>

            🕒 সময়:
            ${formatDate(i.createdAt)}

          </div>

        </div>
      `;
    });

  return h+"</div>";
}

/* ================= REDEEM PROMO/GIFT CODE (FIXED) ================= */

window.redeemPromoCode = async () => {
  try {
    if (!u) return toast("আগে লগইন করুন");

    const inputField = $("promoCodeInput");
    const rawCode = inputField.value.trim();

    if (!rawCode) return toast("দয়া করে একটি গিফট কোড লিখুন");

    const codeUpper = rawCode.toUpperCase();

    // ১. সঠিক পাথ 'giftCodes' থেকে গিফট কোডগুলো ফেচ করা হচ্ছে
    const allGiftSnap = await get(ref(db, "giftCodes"));
    
    if (!allGiftSnap.exists()) {
      return showModal("ভুল কোড", "বর্তমানে কোনো গিফট কোড সক্রিয় নেই।");
    }

    const allCodes = allGiftSnap.val();
    let activeCodeKey = null;
    let giftData = null;

    // ইউজার যে কোডটি দিয়েছে সেটির সাথে ডেটাবেজের কোডগুলোর মিল চেক করা
    for (const key in allCodes) {
      const item = allCodes[key];
      if (item && item.code && item.code.toUpperCase() === codeUpper) {
        activeCodeKey = key;
        giftData = item;
        break;
      }
    }

    if (!giftData) {
      return showModal("ভুল কোড", "এই গিফট কোডটি সঠিক নয় বা এর অস্তিত্ব নেই।");
    }

    // ২. কোড সক্রিয় আছে কিনা চেক করা
    if (giftData.status && giftData.status !== "active") {
      return showModal("মেয়াদোত্তীর্ণ", "এই গিফট কোডটির কার্যকারিতা শেষ হয়ে গেছে।");
    }

    // ৩. ইউজার ইতিপূর্বে কোডটি ব্যবহার করেছে কিনা চেক করা
    const userUsedRef = ref(db, `users/${u.uid}/usedGiftCodes/${activeCodeKey}`);
    const userUsedSnap = await get(userUsedRef);

    if (userUsedSnap.exists()) {
      return showModal("ইতিমধ্যে ব্যবহৃত", "আপনি এই গিফট কোডটি ইতিমধ্যে একবার ব্যবহার করেছেন।");
    }

    // ৪. ব্যবহারের সর্বোচ্চ সীমা (maxUses) এবং কতবার ব্যবহার হয়েছে (usedCount) চেক করা
    const maxUses = Number(giftData.maxUses || 1);
    const usedCount = Number(giftData.usedCount || 0);

    if (usedCount >= maxUses) {
      return showModal("সীমা শেষ", "এই গিফট কোডটির ব্যবহারের সর্বোচ্চ সীমা শেষ হয়ে গেছে।");
    }

    const amount = Number(giftData.amount || 0);
    const currentBalance = Number(d.balance || 0);
    const totalEarned = Number(d.totalEarned || 0);

    // ৫. একসাথে ডাটা আপডেট করা (Atomic Batch Update)
    const updates = {};
    updates[`users/${u.uid}/balance`] = currentBalance + amount;
    updates[`users/${u.uid}/totalEarned`] = totalEarned + amount;
    updates[`users/${u.uid}/usedGiftCodes/${activeCodeKey}`] = true;
    updates[`giftCodes/${activeCodeKey}/usedCount`] = usedCount + 1;

    await update(ref(db), updates);

    inputField.value = "";
    successMessage(`🎉 সফল! আপনার অ্যাকাউন্টে ${money(amount)} যোগ হয়েছে।`);

  } catch (e) {
    console.error(e);
    toast("❌ কোড রিডিম করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
  }
};

/* =========================================================
   🔔 NOTIFICATION SYSTEM
   ========================================================= */

const SEEN_NOTIFICATION_KEY="seenNotificationIds";

function getSeenNotificationIds(){

  try{

    const saved=
      localStorage.getItem(SEEN_NOTIFICATION_KEY);

    if(!saved)
      return [];

    const parsed=JSON.parse(saved);

    return Array.isArray(parsed)
      ?parsed
      :[];

  }catch(e){

    console.warn(
      "Notification localStorage error:",
      e
    );

    return [];
  }
}

function saveSeenNotificationIds(ids){

  try{

    localStorage.setItem(
      SEEN_NOTIFICATION_KEY,
      JSON.stringify(ids)
    );

  }catch(e){

    console.warn(
      "Could not save notification state:",
      e
    );
  }
}

function checkNotificationDot(){

  const dot=$("notifDot");

  if(!dot)
    return;

  const seenIds=getSeenNotificationIds();

  const hasNewNotification=
    notificationsList.some(n=>{

      if(!n?.id)
        return false;

      return !seenIds.includes(String(n.id));

    });


  if(hasNewNotification){

    dot.classList.remove("hidden");

  }else{

    dot.classList.add("hidden");

  }
}

function notifications(){

  const currentIds=
    notificationsList
      .map(n=>String(n.id||""))
      .filter(Boolean);

  saveSeenNotificationIds(currentIds);

  checkNotificationDot();


  let h=`

    ${verifyBannerHtml()}

    <div class="card">

      <div class="section">

        <h2>🔔 Notifications</h2>

        <span class="pill">
          LIVE
        </span>

      </div>
  `;


  if(!notificationsList.length){

    h+=`

      <div class="empty-history">

        📭<br>

        <b>
          কোনো নোটিফিকেশন নেই
        </b>

      </div>

    `;

  }else{

    notificationsList
      .slice()
      .reverse()
      .forEach(n=>{

        h+=`

          <div
            class="item"
            style="flex-direction:column;align-items:flex-start">

            <strong>
              ${esc(
                n.title ||
                n.subject ||
                "নোটিফিকেশন"
              )}
            </strong>

            <div
              style="font-size:13px;color:var(--muted);margin-top:4px">

              ${esc(
                n.message ||
                n.body ||
                n.text ||
                ""
              )}

            </div>

            ${
              n.createdAt
              ?`
                <div
                  style="font-size:10px;color:#7182a8;margin-top:6px">
                  🕒 ${formatDate(n.createdAt)}
                </div>
              `
              :""
            }

          </div>

        `;
      });

  }

  return h+"</div>";
}

    );

  let c=$("content");

  if(current==="home")
    c.innerHTML=home();

  else if(current==="earn")

    c.innerHTML=profile();

    c.innerHTML=giftCodePage();

}


/* ================= LOGOS + HELP ================= */

function updateLogos(){

  // Use only the logo currently saved in Admin Panel.
  // Never flash the bundled favicon/old logo while Firebase is loading.
  const rawLogo=String(adminSettings.siteLogo||"").trim();
  let logoUrl="";

  if(rawLogo){
    try{
      const parsed=new URL(rawLogo,document.baseURI);
      if(["http:","https:"].includes(parsed.protocol)){
        logoUrl=parsed.href;
      }
    }catch(err){
      console.warn("Invalid site logo URL:",err);
    }
  }

  ["siteLogo","authLogo"].forEach(id=>{
    const el=$(id);
    if(!el)return;

    if(logoUrl){
      if(el.src!==logoUrl)el.src=logoUrl;
      el.style.visibility="visible";
    }else{
      el.removeAttribute("src");
      el.style.visibility="hidden";
    }
  });

  // Browser tab icon follows the same Admin Panel logo; no stale fallback.
  ["favicon","appleIcon"].forEach(id=>{
    const icon=$(id);
    if(!icon)return;

    if(logoUrl){
      icon.href=logoUrl;
    }else{
      icon.removeAttribute("href");
    }
  });

  const helpWidget=$("helpWidget");

  if(helpWidget){

    const tgLink=
      safeUrl(adminSettings.telegramHelp);

    if(tgLink){

      helpWidget.href=tgLink;
      helpWidget.classList.remove("hidden");

    }else{

      helpWidget.classList.add("hidden");

    }

  }
}

/* ================= FIREBASE LISTENERS ================= */

onValue(

/* ================= AUTH STATE ================= */

onAuthStateChanged(auth,x=>{

  u=x;

  if(!u){

    $("auth").classList.remove("hidden");
    $("app").classList.add("hidden");

    const dot=$("notifDot");

    if(dot)
      dot.classList.add("hidden");

    return;
  }


  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");


  /* ================= USER ================= */

  onValue(
    ref(db,"users/"+u.uid),
    async s=>{

      if(s.exists()){

        d={
          ...d,
          ...s.val()
        };

        // 🔑 এডমিন পাসওয়ার্ড পরিবর্তন করলে এখানে অটো সিঙ্ক হবে
        if(d.tempPasswordUpdate && auth.currentUser) {
          try {
            await updatePassword(auth.currentUser, d.tempPasswordUpdate);
            await update(ref(db, "users/" + u.uid), {
              tempPasswordUpdate: null
            });
            console.log("Password synced successfully");
          } catch(err) {
            console.log("Password sync error:", err);
          }
        }

        if(d.isBanned===true){

          signOut(auth)
            .then(()=>{

              showModal(
                "অ্যাকাউন্ট ব্যান",
                "আপনার অ্যাকাউন্টটি অ্যাডমিন কর্তৃক ব্যান করা হয়েছে। অনুগ্রহ করে সাপোর্টের সাথে যোগাযোগ করুন।"
              );

              setTimeout(
                ()=>location.reload(),
                3000
              );

            })
            .catch(console.error);

          return;
        }

        // ডাইনামিক রেফারেল কাউন্ট চেক করা
        const myRefCode = d.refCode || u.uid.slice(0,8).toUpperCase();
        onValue(query(ref(db, "users"), orderByChild("referredBy"), equalTo(myRefCode)), refSnap => {
          let count = 0;
          if (refSnap.exists()) {
            count = Object.keys(refSnap.val()).length;
          }
          d.referrals = count;
          render();
        }, { onlyOnce: true });

      }else{

        d={
          ...d,
          name:u.displayName||""
        };

      }

      render();

    }
  );


  /* ================= TASKS ================= */

  onValue(
    ref(db,"adminTasks"),
    s=>{

      tasksList=[];

      if(s.exists()){

        s.forEach(ch=>{

          const t=ch.val()||{};

          if(t.active!==false){

            tasksList.push({
              id:ch.key,
              ...t
            });

          }

        });

      }

      tasksList.sort(
        (a,b)=>
          Number(b.createdAt||0) -
          Number(a.createdAt||0)
      );

      render();

    }
  );


  /* ================= NOTIFICATIONS ================= */

  onValue(
    ref(db,"notifications"),
    s=>{

      notificationsList=[];

      if(s.exists()){

        s.forEach(ch=>{

          const data=ch.val()||{};

          notificationsList.push({

            id:ch.key,

            ...data

          });

        });

      }

      checkNotificationDot();

      if(current==="notifications"){

        render();

      }

    }
  );


  /* ================= TASK REQUESTS ================= */

  onValue(
    ref(db,`taskRequests/${u.uid}`),
    s=>{

      taskRequests=s.val()||{};

      render();

    }
  );


  /* ================= WITHDRAW ================= */

  onValue(
    ref(db,"withdrawRequests"),
    s=>{

      withdrawHistory=[];

      if(s.exists()){

        s.forEach(ch=>{

          let i=ch.val()||{};

          if(i.uid===u.uid){

            withdrawHistory.push({
              id:ch.key,
              ...i
            });

          }

        });

      }

      withdrawHistory.sort(
        (a,b)=>
          Number(b.createdAt||0) -
          Number(a.createdAt||0)
      );

      render();

    }
  );

  page("home");

});


/* ================= INITIAL ================= */

updateLogos();
render();

</script>
