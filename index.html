<style>
:root{
  --bg:#030716;--bg2:#07142f;--card:#0b1a3d;--border:#6ba6ff33;
  --text:#f8fbff;--muted:#a7b4d6;--blue:#12b6ff;--blue2:#216bff;
  --purple:#8d42ff;--cyan:#34f5ff;--green:#1ee6a3;--red:#ff4d6d;--yellow:#fbbf24
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
  radial-gradient(circle at 10% 5%,#8d42ff45,transparent 30%),
  radial-gradient(circle at 90% 20%,#12b6ff35,transparent 30%),
  linear-gradient(180deg,var(--bg),var(--bg2),#030713);
  color:var(--text);
  font-family:"Hind Siliguri",Inter,sans-serif
}
button,input,select{font-family:inherit}
.hidden{display:none!important}

.app{
  max-width:460px;margin:auto;min-height:100vh;padding:14px 14px 90px
}
.nav{
  position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;
  align-items:center;padding:10px;border:1px solid var(--border);
  border-radius:23px;background:#061027dd;backdrop-filter:blur(18px);margin-bottom:14px
}
.brand{
  display:flex;gap:10px;align-items:center;font-size:23px;font-weight:800
}
.logo{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue2),var(--purple));
  box-shadow:0 0 25px #216bff55;font-weight:800;overflow:hidden;flex-shrink:0
}
.logo img{width:100%;height:100%;object-fit:cover}

.icon{
  width:40px;height:40px;border:1px solid var(--border);border-radius:14px;
  background:#fff1;color:#fff;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center
}

.card{
  background:linear-gradient(145deg,#0c1b3fd0,#081129d0);
  border:1px solid var(--border);border-radius:25px;padding:16px;margin-bottom:14px;
  box-shadow:0 18px 50px #0005,inset 0 1px #fff1;backdrop-filter:blur(18px)
}
.hero{
  padding:24px 19px;text-align:center;border-radius:31px;
  background:
  radial-gradient(circle at 15% 18%,#c155ff70,transparent 32%),
  radial-gradient(circle at 78% 55%,#12b6ff66,transparent 36%),
  linear-gradient(130deg,#4526b1e0,#1437a6d1,#110c34e0);
  border:1px solid #8f50ff99
}
.hero h1{font-size:35px;line-height:1.12;margin:10px 0}
.grad{
  background:linear-gradient(135deg,var(--cyan),#fff,#c155ff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.muted{color:var(--muted)}
.small{font-size:12px}
.row,.grid{display:grid;gap:10px}
.row,.grid{grid-template-columns:1fr 1fr}

.btn{
  min-height:48px;border:0;border-radius:17px;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--blue2),var(--purple),var(--cyan));
  box-shadow:0 12px 30px #216bff35;padding:0 12px;cursor:pointer
}
.btn.alt{
  background:#fff0;border:1px solid var(--border);box-shadow:none
}
.btn:disabled{opacity:.55;cursor:not-allowed}

.stat{
  padding:14px;border:1px solid var(--border);border-radius:19px;background:#fff1
}
.stat b{display:block;font-size:20px}

.section{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:11px
}
.section h3,.section h2{margin:0}
.pill{
  padding:4px 9px;border-radius:99px;background:#1ee6a31a;color:var(--green);font-size:11px
}
.item{
  display:flex;justify-content:space-between;align-items:center;padding:12px;
  border-radius:17px;background:#fff1;border:1px solid #fff1;margin-bottom:9px
}
.item strong{display:block}

.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(460px,100%);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px;background:#061027ee;border-top:1px solid var(--border);
  backdrop-filter:blur(18px)
}
.bottom button{
  border:0;background:none;color:var(--muted);font-size:10px;cursor:pointer
}
.bottom button.active{color:#fff}
.bottom span{display:block;font-size:18px}

.auth{min-height:100vh;display:grid;place-items:center}
.authbox{width:100%;max-width:420px}

input,select{
  width:100%;height:48px;border-radius:15px;border:1px solid var(--border);
  background:#020817;color:#fff;padding:0 13px;outline:none;margin-bottom:10px
}
label{
  display:block;color:var(--muted);font-size:12px;margin:4px 0
}

.toast,.success-toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:100000;color:#fff;padding:10px 15px;border-radius:13px;font-size:13px;
  max-width:90%;text-align:center
}
.toast{background:#102653;border:1px solid var(--border)}
.success-toast{
  background:#16a34a;border:1px solid #4ade80;padding:13px 18px;
  font-size:15px;font-weight:700;box-shadow:0 8px 25px #0005
}

.verify-banner{
  background:linear-gradient(135deg,var(--blue2),var(--purple));
  border:1px solid var(--border);border-radius:18px;padding:12px 16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center
}

.method-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px
}
.method-card{
  background:#0b1a3d;border:2px solid var(--border);border-radius:16px;
  padding:15px 8px;text-align:center;cursor:pointer;color:#fff;font-weight:600;
  transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px
}
.method-card img{
  width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px
}
.method-card.active{
  border-color:var(--blue);background:#12b6ff15
}

.deposit-box{
  background:linear-gradient(145deg,#0c1b3fd8,#07122bd8);
  border:1px solid var(--border);border-radius:22px;padding:16px;color:#fff;
  margin-bottom:14px;box-shadow:0 10px 30px #0004
}
.deposit-box ol{padding-left:18px;margin:10px 0}
.deposit-box li{margin-bottom:8px;font-size:13.5px;line-height:1.4}

.task-card{
  position:relative;overflow:hidden;background:linear-gradient(145deg,#101f49e8,#07132ee8);
  border:1px solid #6ba6ff44;border-radius:22px;padding:14px;margin-bottom:12px;
  box-shadow:0 10px 30px #0005
}
.task-top{display:flex;align-items:center;gap:12px}
.task-logo{
  width:58px;height:58px;border-radius:15px;display:grid;place-items:center;
  background:#fff;overflow:hidden;flex-shrink:0;border:1px solid #ffffff22
}
.task-logo img{
  width:48px;height:48px;object-fit:contain;display:block
}
.task-logo .fallback{font-size:25px;line-height:1}
.task-info{flex:1;min-width:0}
.task-title{
  font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.task-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.reward-badge{
  display:inline-block;margin-top:6px;padding:4px 9px;border-radius:99px;
  background:#1ee6a31a;color:var(--green);font-size:11px;font-weight:700
}
.task-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px
}
.task-btn{
  min-height:43px;border:0;border-radius:14px;font-weight:800;cursor:pointer;color:#fff
}
.open-btn{background:linear-gradient(135deg,#216bff,#12b6ff)}
.claim-btn{background:linear-gradient(135deg,#8d42ff,#c155ff)}
.claim-btn.locked{
  background:#ffffff12;border:1px solid #ffffff22;color:#8492b5
}
.task-btn:disabled{opacity:.6;cursor:not-allowed}
.task-note{
  margin-top:9px;padding:8px 10px;border-radius:12px;background:#ffb30010;
  border:1px solid #ffb30025;font-size:11px;color:#d9c99a
}
.task-banner{
  width:100%;max-height:180px;object-fit:cover;border-radius:14px;
  margin-top:10px;border:1px solid var(--border);display:block
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999999;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px)
}
.modal-box{
  background:#fff;color:#333;width:100%;max-width:380px;border-radius:18px;
  padding:36px 24px 30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45);
  font-family:Inter,sans-serif
}
.modal-icon-wrap{
  width:90px;height:90px;border:5px solid #f87171;border-radius:50%;
  margin:0 auto 24px;display:flex;align-items:center;justify-content:center;background:#fff
}
.modal-icon-wrap svg{
  width:46px;height:46px;stroke:#ef4444;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;fill:none
}
.modal-title{font-size:27px;font-weight:700;color:#374151;margin-bottom:14px}
.modal-desc{font-size:16px;color:#4b5563;line-height:1.5;margin-bottom:28px}
.modal-btn{
  background:#7c65e8;color:#fff;border:0;padding:12px 45px;border-radius:8px;
  font-size:16px;font-weight:600;cursor:pointer
}

.history-card{
  background:linear-gradient(145deg,#0c1b3fd8,#07122bd8);
  border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px
}
.history-top{
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.history-amount{font-size:20px;font-weight:800}
.status{
  display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800
}
.status.pending{
  background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b40
}
.status.success{
  background:#22c55e20;color:#4ade80;border:1px solid #22c55e40
}
.status.rejected{
  background:#ef444420;color:#f87171;border:1px solid #ef444440
}
.status.unknown{
  background:#ffffff10;color:#a7b4d6;border:1px solid #ffffff20
}
.history-info{
  margin-top:10px;padding-top:10px;border-top:1px solid #ffffff10;
  font-size:12px;color:var(--muted);line-height:1.7
}
.empty-history{text-align:center;padding:30px 15px;color:var(--muted)}

/* 🎧 হেল্প সেন্টার */
.support-widget{
  position:fixed;bottom:75px;right:18px;z-index:999;display:flex;
  align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue2),var(--purple));
  color:#fff;padding:10px 16px;border-radius:50px;
  box-shadow:0 8px 25px rgba(33,107,255,.4);cursor:pointer;text-decoration:none;
  font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.2);
  animation:pulseSupport 2s infinite,floatSupport 3s ease-in-out infinite;
  backdrop-filter:blur(10px)
}
.support-widget svg{
  width:22px;height:22px;fill:currentColor;
  animation:rotateIcon 4s ease-in-out infinite
}
@keyframes pulseSupport{
  0%{box-shadow:0 0 0 0 rgba(141,66,255,.6)}
  70%{box-shadow:0 0 0 12px rgba(141,66,255,0)}
  100%{box-shadow:0 0 0 0 rgba(141,66,255,0)}
}
@keyframes floatSupport{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes rotateIcon{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-10deg)}
  75%{transform:rotate(10deg)}
}

/* 🔴 নোটিফিকেশন লাল ডট */
.notif-dot{
  position:absolute;
  top:5px;
  right:5px;
  width:11px;
  height:11px;
  background:var(--red);
  border-radius:50%;
  border:2px solid var(--bg2);
  box-shadow:0 0 10px var(--red);
  z-index:10;
  animation:notifPulse 1.5s infinite
}
@keyframes notifPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.25);opacity:.75}
}

  const androidWebView=/Android/i.test(ua)&&(/;\s*wv\)/i.test(ua)||/\bwv\b/i.test(ua));
  const iosWebView=/(iPhone|iPad|iPod)/i.test(ua)&&!/Safari/i.test(ua);
  const nativeBridge=!!(
    window.ReactNativeWebView||
    window.Android||
    window.androidBridge||
    window.AppInventor
  );
  const explicitAppFlag=/(?:[?&](?:app|appmint|inapp)=1)(?:&|$)/i.test(location.search);
  return androidWebView||iosWebView||appMintUserAgent||nativeBridge||explicitAppFlag;
}

  if(!t)return;

  t.textContent=x;
  t.classList.remove("hidden","success-toast");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(
    ()=>t.classList.add("hidden"),
    3500
  );
}

/* ================= TASK STATUS ================= */

function getTaskStatus(taskId){

  for(const key in taskRequests){

    const r=taskRequests[key];

    if(
      r &&
      (
        r.taskId===taskId ||
        key.startsWith(taskId+"_")
      )
    )
      return r;
  }

  return null;
}

/* ================= OPEN TASK ================= */

window.openTask=(id,encoded)=>{

  try{

    if(!u)
      return toast("আগে login করুন");

    let link="";

    try{
      link=decodeURIComponent(encoded||"").trim();
    }catch{
      link=String(encoded||"").trim();
    }

    link=safeUrl(link);

    if(!link)

      return showModal(
        "লিংক নেই",
        "Admin Panel-এর Task URL ঘরে সম্পূর্ণ https:// ভিডিও লিংক দিন।"
      );

    const today=new Date().toISOString().slice(0,10);
    const key=id+"_"+today;
    const opened="taskOpened_"+id+"_"+today;
    const old=getTaskStatus(id);

    if(["approved","success"].includes(old?.status))
      return toast("✅ এই Task-এর Reward ইতিমধ্যে দেওয়া হয়েছে");

    const w=window.open(
      link,
      "_blank",
      "noopener,noreferrer"
    );

    if(!w)
      window.location.href=link;

    sessionStorage.setItem(opened,"1");

    update(
      ref(db,`taskRequests/${u.uid}/${key}`),
      {
        uid:u.uid,
        taskId:id,
        date:today,
        opened:true,
        openedAt:serverTimestamp(),
        status:old?.status||"opened"
      }
    ).catch(console.warn);

    toast(
      "✅ কাজের লিংক Open হয়েছে। কাজ শেষ করে ফিরে এসে Claim চাপুন।"
    );

  }catch(e){

    console.error(e);
    toast("❌ Task Open করতে সমস্যা হয়েছে");

  }

};


/* ================= CLAIM ================= */

window.claimTask=async(id,rewardAmt)=>{

  try{

    if(!u)
      return toast("আগে লগইন করুন");

    const today=new Date().toISOString().slice(0,10);
    const key=id+"_"+today;
    const opened="taskOpened_"+id+"_"+today;

    const ts=await get(ref(db,`adminTasks/${id}`));

    if(!ts.exists())
      return toast("❌ Task আর পাওয়া যাচ্ছে না");

    const t=ts.val()||{};

    if(t.active===false)
      return toast("❌ এই Task বর্তমানে বন্ধ আছে");

    const reward=Number(
      t.reward!==undefined
      ? t.reward
      : rewardAmt
    );

    const old=getTaskStatus(id);

    if(!Number.isFinite(reward)||reward<=0)
      return toast("❌ Task Reward সঠিক নয়");

    if(["approved","success"].includes(old?.status))
      return toast("✅ Reward ইতিমধ্যে দেওয়া হয়েছে");

    if(old?.status==="pending")
      return toast("⏳ Claim Request Pending আছে");

    if(
      sessionStorage.getItem(opened)!=="1" &&
      old?.opened!==true
    )
      return showModal(
        "আগে Task Open করুন",
        "Claim করার আগে Task-এর লিঙ্কে প্রবেশ করুন এবং কাজটি সম্পন্ন করুন।"
      );

    const r=push(ref(db,"taskClaimRequests"));
    const claimId=r.key;

    const updates={};

    updates[`taskRequests/${u.uid}/${key}`]={
      uid:u.uid,
      taskId:id,
      taskTitle:t.title||"Task",
      reward,
      date:today,
      opened:true,
      status:"pending",
      claimId,
      createdAt:serverTimestamp()
    };

    updates[`taskClaimRequests/${claimId}`]={
      uid:u.uid,
      taskId:id,
      taskTitle:t.title||"Task",
      reward,
      name:d.name||u.displayName||"User",
      email:u.email||"",
      status:"pending",
      requestKey:key,
      createdAt:serverTimestamp()
    };

    await update(ref(db),updates);

    sessionStorage.removeItem(opened);

    successMessage(
      "✅ Claim Request সফলভাবে পাঠানো হয়েছে। Admin যাচাই করবেন।"
    );

    render();

  }catch(e){

    console.error(e);
    toast("❌ Claim Request পাঠাতে সমস্যা হয়েছে");

  }

};

function getWithdrawStatus(s){

  s=String(s||"pending").toLowerCase();

  if(
    ["success","successful","approved","paid","completed"]
    .includes(s)
  )
    return{
      className:"success",
      text:"✅ Success"
    };

  if(
    ["rejected","reject","cancelled","canceled"]
    .includes(s)
  )
    return{
      className:"rejected",
      text:"❌ Rejected"
    };

  return{
    className:"pending",
    text:"⏳ Pending"
  };
}

function formatDate(ts){

  if(!ts)
    return "সময় পাওয়া যায়নি";

  let date=
    typeof ts==="object"&&ts?.seconds
    ?new Date(Number(ts.seconds)*1000)
    :new Date(ts);

  return isNaN(date.getTime())
    ?"সময় পাওয়া যায়নি"
    :date.toLocaleString(
      "bn-BD",
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );
}

/* ================= REDEEM PROMO/GIFT CODE (FIXED) ================= */

window.redeemPromoCode = async () => {
  try {
    if (!u) return toast("আগে লগইন করুন");

    const inputField = $("promoCodeInput");
    const rawCode = inputField.value.trim();

    if (!rawCode) return toast("দয়া করে একটি গিফট কোড লিখুন");

    const codeUpper = rawCode.toUpperCase();

    // ১. সঠিক পাথ 'giftCodes' থেকে গিফট কোডগুলো ফেচ করা হচ্ছে
    const allGiftSnap = await get(ref(db, "giftCodes"));
    
    if (!allGiftSnap.exists()) {
      return showModal("ভুল কোড", "বর্তমানে কোনো গিফট কোড সক্রিয় নেই।");
    }

    const allCodes = allGiftSnap.val();
    let activeCodeKey = null;
    let giftData = null;

    // ইউজার যে কোডটি দিয়েছে সেটির সাথে ডেটাবেজের কোডগুলোর মিল চেক করা
    for (const key in allCodes) {
      const item = allCodes[key];
      if (item && item.code && item.code.toUpperCase() === codeUpper) {
        activeCodeKey = key;
        giftData = item;
        break;
      }
    }

    if (!giftData) {
      return showModal("ভুল কোড", "এই গিফট কোডটি সঠিক নয় বা এর অস্তিত্ব নেই।");
    }

    // ২. কোড সক্রিয় আছে কিনা চেক করা
    if (giftData.status && giftData.status !== "active") {
      return showModal("মেয়াদোত্তীর্ণ", "এই গিফট কোডটির কার্যকারিতা শেষ হয়ে গেছে।");
    }

    // ৩. ইউজার ইতিপূর্বে কোডটি ব্যবহার করেছে কিনা চেক করা
    const userUsedRef = ref(db, `users/${u.uid}/usedGiftCodes/${activeCodeKey}`);
    const userUsedSnap = await get(userUsedRef);

    if (userUsedSnap.exists()) {
      return showModal("ইতিমধ্যে ব্যবহৃত", "আপনি এই গিফট কোডটি ইতিমধ্যে একবার ব্যবহার করেছেন।");
    }

    // ৪. ব্যবহারের সর্বোচ্চ সীমা (maxUses) এবং কতবার ব্যবহার হয়েছে (usedCount) চেক করা
    const maxUses = Number(giftData.maxUses || 1);
    const usedCount = Number(giftData.usedCount || 0);

    if (usedCount >= maxUses) {
      return showModal("সীমা শেষ", "এই গিফট কোডটির ব্যবহারের সর্বোচ্চ সীমা শেষ হয়ে গেছে।");
    }

    const amount = Number(giftData.amount || 0);
    const currentBalance = Number(d.balance || 0);
    const totalEarned = Number(d.totalEarned || 0);

    // ৫. একসাথে ডাটা আপডেট করা (Atomic Batch Update)
    const updates = {};
    updates[`users/${u.uid}/balance`] = currentBalance + amount;
    updates[`users/${u.uid}/totalEarned`] = totalEarned + amount;
    updates[`users/${u.uid}/usedGiftCodes/${activeCodeKey}`] = true;
    updates[`giftCodes/${activeCodeKey}/usedCount`] = usedCount + 1;

    await update(ref(db), updates);

    inputField.value = "";
    successMessage(`🎉 সফল! আপনার অ্যাকাউন্টে ${money(amount)} যোগ হয়েছে।`);

  } catch (e) {
    console.error(e);
    toast("❌ কোড রিডিম করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
  }
};

const SEEN_NOTIFICATION_KEY="seenNotificationIds";

function getSeenNotificationIds(){

  try{

    const saved=
      localStorage.getItem(SEEN_NOTIFICATION_KEY);

    if(!saved)
      return [];

    const parsed=JSON.parse(saved);

    return Array.isArray(parsed)
      ?parsed
      :[];

  }catch(e){

    console.warn(
      "Notification localStorage error:",
      e
    );

    return [];
  }
}

function saveSeenNotificationIds(ids){

  try{

    localStorage.setItem(
      SEEN_NOTIFICATION_KEY,
      JSON.stringify(ids)
    );

  }catch(e){

    console.warn(
      "Could not save notification state:",
      e
    );
  }
}

function checkNotificationDot(){

  const dot=$("notifDot");

  if(!dot)
    return;

  const seenIds=getSeenNotificationIds();

  const hasNewNotification=
    notificationsList.some(n=>{

      if(!n?.id)
        return false;

      return !seenIds.includes(String(n.id));

    });


  if(hasNewNotification){

    dot.classList.remove("hidden");

  }else{

    dot.classList.add("hidden");

  }
}

/* ================= LOGOS + HELP ================= */

function updateLogos(){

  // Use only the logo currently saved in Admin Panel.
  // Never flash the bundled favicon/old logo while Firebase is loading.
  const rawLogo=String(adminSettings.siteLogo||"").trim();
  let logoUrl="";

  if(rawLogo){
    try{
      const parsed=new URL(rawLogo,document.baseURI);
      if(["http:","https:"].includes(parsed.protocol)){
        logoUrl=parsed.href;
      }
    }catch(err){
      console.warn("Invalid site logo URL:",err);
    }
  }

  ["siteLogo","authLogo"].forEach(id=>{
    const el=$(id);
    if(!el)return;

    if(logoUrl){
      if(el.src!==logoUrl)el.src=logoUrl;
      el.style.visibility="visible";
    }else{
      el.removeAttribute("src");
      el.style.visibility="hidden";
    }
  });

  // Browser tab icon follows the same Admin Panel logo; no stale fallback.
  ["favicon","appleIcon"].forEach(id=>{
    const icon=$(id);
    if(!icon)return;

    if(logoUrl){
      icon.href=logoUrl;
    }else{
      icon.removeAttribute("href");
    }
  });

  const helpWidget=$("helpWidget");

  if(helpWidget){

    const tgLink=
      safeUrl(adminSettings.telegramHelp);

    if(tgLink){

      helpWidget.href=tgLink;
      helpWidget.classList.remove("hidden");

    }else{

      helpWidget.classList.add("hidden");

    }

  }
}

        };

            });

              );

                ()=>location.reload(),

              );

            })
            .catch(console.error);

          return;
        }

        // ডাইনামিক রেফারেল কাউন্ট চেক করা
        const myRefCode = d.refCode || u.uid.slice(0,8).toUpperCase();

  onValue(
    ref(db,"adminTasks"),
    s=>{

          const t=ch.val()||{};

          if(t.active!==false){

            tasksList.push({
              id:ch.key,
              ...t
            });

          }

        });

      tasksList.sort(

          Number(b.createdAt||0) -

    }

    ref(db,"notifications"),

      if(s.exists()){

        s.forEach(ch=>{

          if(i.uid===u.uid){

            withdrawHistory.push({
              id:ch.key,
              ...i
            });

          }

        });

      }

      withdrawHistory.sort(
        (a,b)=>
          Number(b.createdAt||0) -
          Number(a.createdAt||0)
      );

      render();

    }
  );

  page("home");

});

updateLogos();
render();

</script>
